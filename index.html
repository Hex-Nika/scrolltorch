<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollTorch | Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --brand-color: #ff2b54; --bg-color: #0d0d12; --card-bg: #1a1a20; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg-color); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .feed { 
            height: 100vh; width: 100vw; 
            overflow-y: scroll; 
            scroll-snap-type: y mandatory; 
            scroll-behavior: smooth; 
            display: none; 
            -webkit-overflow-scrolling: touch;
        }
        .feed::-webkit-scrollbar { display: none; }

        /* Auth Overlay */
        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px; text-align: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1); max-width: 400px; width: 100%;
            backdrop-filter: blur(10px);
        }
        input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: #1a1a20; color: white; box-sizing: border-box;
        }
        .btn {
            background: var(--brand-color); color: white; border: none; padding: 12px 25px;
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s;
        }
        .btn:disabled { background: #444; cursor: not-allowed; }
        .verify-step { display: none; margin-top: 20px; }
        .code-box { font-size: 32px; font-weight: bold; letter-spacing: 5px; color: var(--brand-color); margin: 15px 0; }
        
        /* Project Containers */
        .project-container { 
            height: 100vh; width: 100vw; 
            position: relative; 
            scroll-snap-align: start; 
            display: flex; justify-content: center; align-items: center; 
            background: #000; 
            overflow: hidden;
        }
        .idle-text { position: absolute; color: #222; font-weight: bold; font-size: 14px; z-index: 1; letter-spacing: 2px; }
        .project-iframe { 
            width: 100%; height: 100%; border: none; z-index: 2; 
            opacity: 0; transition: opacity 0.4s ease;
            will-change: transform; transform: translateZ(0);
        }

        /* Overlay UI */
        .ui-overlay { position: absolute; right: 20px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .action-btn { 
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; 
            width: 55px; height: 55px; font-size: 22px; color: white; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn.liked { color: var(--brand-color); border-color: var(--brand-color); }

        /* Comments Panel */
        #comment-panel {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 65vh;
            background: var(--card-bg); border-radius: 25px 25px 0 0; z-index: 2000;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            padding: 25px; box-sizing: border-box; display: flex; flex-direction: column;
        }
        #comment-panel.open { bottom: 0; }
        #comment-list { flex-grow: 1; overflow-y: auto; margin: 15px 0; scrollbar-width: none; }
        .comment-item { margin-bottom: 12px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.03); }
        .comment-user { font-weight: 800; color: var(--brand-color); font-size: 13px; margin-bottom: 3px; }
        .comment-text { font-size: 15px; line-height: 1.4; opacity: 0.9; }

        .loading-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>ScrollTorch Login</h2>
            <div id="step-1">
                <p>Enter your CodeTorch username</p>
                <input type="text" id="username-input" placeholder="Username">
                <button class="btn" onclick="generateCode()">Get Verification Code</button>
            </div>
            <div id="step-2" class="verify-step">
                <p>Post this code on project <b>236365</b>:</p>
                <div class="code-box" id="display-code">------</div>
                <a href="https://codetorch.net/projects/236365" target="_blank" style="color: #4a90e2; font-size: 14px; text-decoration: none;">Open Comments</a>
                <button class="btn" id="verify-btn" style="margin-top: 20px;" onclick="verifyComment()">Verify Me</button>
                <p id="auth-error" style="color: #ff4d4d; font-size: 13px; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <div id="feed" class="feed">
        <div id="initial-loading" class="loading-screen">
            <div style="margin-bottom: 10px;">Starting Algorithm...</div>
        </div>
    </div>

    <div id="comment-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0">Comments</h3>
            <button onclick="toggleComments()" style="background:none; border:none; color:#888; font-size:24px; cursor:pointer;">✕</button>
        </div>
        <div id="comment-list"></div>
        <div style="display:flex; gap:10px; align-items: center;">
            <input type="text" id="c-input" placeholder="Add a nice comment..." style="margin:0">
            <button class="action-btn" style="width:50px; height:50px; background:var(--brand-color)" onclick="sendComment()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'https://nuefsauipnwmfzgkcpfk.supabase.co/rest/v1';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51ZWZzYXVpcG53bWZ6Z2tjcGZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NDU1MjgsImV4cCI6MjA4OTEyMTUyOH0.f_DL7d5qwx_QDKYpscuoNOLEZAa6RFDSO3EAbiV_Adc';
        
        let CURRENT_USER = '';
        let AUTH_CODE = '';
        let isFetching = false;
        let activeProject = null;

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const container = entry.target;
                const iframe = container.querySelector('iframe');
                const id = container.getAttribute('data-id');
                const embedUrl = `https://codetorch.net/projects/${id}/embed`;

                if (entry.isIntersecting) {
                    if (iframe.src !== embedUrl) {
                        iframe.src = embedUrl;
                        iframe.style.opacity = "1";
                    }
                    track(id, 'viewed');
                } else {
                    if (iframe.src !== 'about:blank') {
                        iframe.src = 'about:blank';
                        iframe.style.opacity = "0";
                    }
                }
            });
        }, { threshold: 0.1 });

        // --- AUTH ---
        function generateCode() {
            const user = document.getElementById('username-input').value.trim();
            if (!user) return alert("Please enter a username");
            CURRENT_USER = user;
            AUTH_CODE = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('display-code').innerText = AUTH_CODE;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        }

        async function verifyComment() {
            const btn = document.getElementById('verify-btn');
            btn.disabled = true; btn.innerText = "Checking...";
            try {
                const response = await fetch(`https://api.codetorch.net/v1/comments/projects/236365?limit=15&offset=0`);
                const comments = await response.json();
                const isVerified = comments.some(c => c.userSent.toLowerCase() === CURRENT_USER.toLowerCase() && c.message.includes(AUTH_CODE));
                if (isVerified) {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('feed').style.display = 'block';
                    loadNextChunk();
                } else {
                    document.getElementById('auth-error').innerText = "Code not found in comments.";
                    btn.disabled = false; btn.innerText = "Verify Me";
                    loadNextChunk();
                }
            } catch (e) { btn.disabled = false; }
        }

        // --- CORE ALGO ---
        async function loadNextChunk() {
            if (isFetching) return;
            isFetching = true;
            try {
                const response = await fetch(`${API_URL}/rpc/get_scroll_chunk_v2`, {
                    method: 'POST',
                    headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_name: CURRENT_USER })
                });
                const data = await response.json();
                if (document.getElementById('initial-loading')) document.getElementById('initial-loading').remove();
                
                if (data && data.length > 0) {
                    data.forEach(item => renderProject(item.res_project_id));
                    if (data[0].pool_low) {
                        fetch(`${API_URL}/rpc/harvest_projects`, {
                            method: 'POST',
                            headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ target_tag: 'game' }) 
                        }).catch(e => {});
                    }
                }
            } catch (err) { console.error(err); } 
            finally { isFetching = false; }
        }

        function renderProject(id) {
            const container = document.createElement('div');
            container.className = 'project-container';
            container.setAttribute('data-id', id);
            container.innerHTML = `
                <div class="idle-text">ENGINE IDLE</div>
                <iframe class="project-iframe" src="about:blank" allow="autoplay; fullscreen; keyboard"></iframe>
                <div class="ui-overlay">
                    <button class="action-btn" onclick="track(${id}, 'liked', this)">❤️</button>
                    <button class="action-btn" onclick="openComments(${id})"><i class="fas fa-comment"></i></button>
                    <button class="action-btn" onclick="window.open('https://codetorch.net/projects/${id}')"><i class="fas fa-external-link"></i></button>
                    <button class="action-btn" onclick="skip(this, ${id})">⏭️</button>
                </div>
            `;
            document.getElementById('feed').appendChild(container);
            observer.observe(container);
        }

        // --- SOCIAL & TRACKING ---
        async function track(id, type, btn) {
            if (btn && type === 'liked') btn.classList.toggle('liked');
            await fetch(`${API_URL}/torchscroll_interactions`, {
                method: 'POST',
                headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: CURRENT_USER, project_id: id, action_type: type })
            });
        }

        function toggleComments() { document.getElementById('comment-panel').classList.toggle('open'); }

        async function openComments(id) {
            activeProject = id;
            toggleComments();
            const list = document.getElementById('comment-list');
            list.innerHTML = `<div class="loading-screen" style="position:relative">Reading code...</div>`;

            const response = await fetch(`${API_URL}/torchscroll_comments?project_id=eq.${id}&order=created_at.desc`, {
                headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
            });
            const data = await response.json();
            
            list.innerHTML = "";
            if(data && data.length > 0) {
                data.forEach(c => {
                    list.innerHTML += `<div class="comment-item"><div class="comment-user">@${c.username}</div><div class="comment-text">${c.comment_text}</div></div>`;
                });
            } else {
                list.innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:50px;">No comments yet.</div>`;
            }
        }

        async function sendComment() {
            const input = document.getElementById('c-input');
            const msg = input.value.trim();
            if(!msg || !activeProject) return;

            const res = await fetch(`${API_URL}/rpc/post_safe_comment`, {
                method: 'POST',
                headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ proj_id: activeProject, user_name: CURRENT_USER, input_text: msg })
            });
            const data = await res.json();
            
            if(data === 'SUCCESS') {
                input.value = "";
                openComments(activeProject); // Refresh
            } else { alert(data); }
        }

        function skip(btn, id) {
            track(id, 'skipped');
            const current = btn.closest('.project-container');
            if (current.nextElementSibling) current.nextElementSibling.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('feed').onscroll = () => {
            const feed = document.getElementById('feed');
            if (feed.scrollHeight - (feed.scrollTop + feed.clientHeight) < 1200) loadNextChunk();
        };
    </script>
</body>
</html>
